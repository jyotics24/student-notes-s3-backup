<!DOCTYPE html>
<html>
<head>
    <title>Student Notes App</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 40px;
        }

        .container {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
        }

        input, textarea {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            box-sizing: border-box;
        }

        button {
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            border: none;
            cursor: pointer;
        }

        .note {
            background-color: #eeeeee;
            padding: 15px;
            margin-top: 15px;
        }

        .delete {
            color: red;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>📚 Student Notes App</h1>

    <form action="/add" method="POST">

        <input
            type="text"
            name="title"
            placeholder="Note title"
            required
        >

        <textarea
            name="content"
            placeholder="Write your note..."
            required
        ></textarea>

        <button type="submit">Add Note</button>

    </form>

    <hr>

    <h2>My Notes</h2>

    {% for note in notes %}

        <div class="note">

            <h3>{{ note.title }}</h3>

            <p>{{ note.content }}</p>

            <a class="delete" href="/delete/{{ note.id }}">
                Delete
            </a>

        </div>

    {% else %}

        <p>No notes available.</p>

    {% endfor %}

</div>

</body>
</html>
